server:
  port: 8080

spring:
  application:
    name: rolematch-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: false
    mode: HTML

gemini:
  api:
    key: ${GEMINI_API_KEY:demo-key}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

logging:
  level:
    com.rolematch: INFO
    org.hibernate.SQL: WARN

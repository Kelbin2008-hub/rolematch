# ==============================================================================
# RoleMatch Enterprise Backend Configuration
# Java 21, Spring Boot 3.3.4, PostgreSQL (Supabase), Gemini 1.5 & Resend APIs
# ==============================================================================

spring.application.name=rolematch-backend
server.port=8080

# Import local secrets file if present (ignored in Git)
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL Database Connectivity
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# Spring Data JPA & Hibernate 6 JSONB Settings
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Multipart File Upload (Resume PDF/DOCX)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Google Gemini 1.5 AI REST API Configuration
gemini.api.key=${GEMINI_API_KEY:demo-key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Resend Transactional Email API Configuration
resend.api.key=${RESEND_API_KEY:re_demo_key}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Logging configuration
logging.level.com.rolematch=INFO
logging.level.org.hibernate.SQL=WARN

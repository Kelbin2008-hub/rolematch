# ==============================================================================
# RoleMatch Test Configuration (In-Memory H2 in PostgreSQL Mode)
# ==============================================================================

spring.application.name=rolematch-backend-test

# In-Memory H2 Database with PostgreSQL syntax compatibility
spring.datasource.url=jdbc:h2:mem:rolematch_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable automatic schema.sql script execution for H2 tests (handled by Hibernate ddl-auto)
spring.sql.init.mode=never

# Hibernate in H2 mode
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Gemini & Resend Mock / Demo Settings
gemini.api.key=demo-key
gemini.api.url=https://mock.gemini.api/v1beta/models/gemini-1.5-flash:generateContent
resend.api.key=re_demo_key
resend.from.email=onboarding@resend.dev

# Logging
logging.level.com.rolematch=INFO
logging.level.org.hibernate.SQL=WARN
